# =============================================================================
# Octop — Docker Compose (thư mục octop-orgchester)
#
# Build image từ mã nguồn trong ../Octop (Dockerfile có sẵn tại Octop/docker/).
#
# Chạy:
#   cp .env.example .env        # chỉnh sửa giá trị nếu cần
#   docker compose up -d --build
#   docker compose logs -f octop
#   docker compose down
#
# Mở trình duyệt: http://localhost:${OCTOP_PORT:-8088}
# =============================================================================

services:
  octop:
    build:
      context: ../Octop
      dockerfile: docker/Dockerfile
    image: octop:latest
    container_name: octop
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    ports:
      - "${OCTOP_PORT:-8088}:${OCTOP_PORT:-8088}"
    volumes:
      # Dữ liệu (DB SQLite, cấu hình, knowledge index, cache embedding) nằm ở ./data
      - ${OCTOP_DATA:-./data}:/data/.octop
    environment:
      - HOME=/data
      - OCTOP_BIND_HOST=0.0.0.0
      - OCTOP_PORT=${OCTOP_PORT:-8088}
      - OCTOP_LOG_LEVEL=${OCTOP_LOG_LEVEL:-info}
      - OCTOP_DEFAULT_PASSWORD=${OCTOP_DEFAULT_PASSWORD:-}
      - OCTOP_ADMIN_USERNAME=${OCTOP_ADMIN_USERNAME:-admin}
      - OCTOP_ADMIN_DISPLAY_NAME=${OCTOP_ADMIN_DISPLAY_NAME:-Admin}
      - OCTOP_DATABASE_URL=${OCTOP_DATABASE_URL:-}
      - OCTOP_DATABASE_DRIVER=${OCTOP_DATABASE_DRIVER:-}
      - OCTOP_DATABASE_SQLITE_PATH=${OCTOP_DATABASE_SQLITE_PATH:-}
      - OCTOP_DATABASE_HOST=${OCTOP_DATABASE_HOST:-}
      - OCTOP_DATABASE_PORT=${OCTOP_DATABASE_PORT:-}
      - OCTOP_DATABASE_NAME=${OCTOP_DATABASE_NAME:-}
      - OCTOP_DATABASE_USER=${OCTOP_DATABASE_USER:-}
      - OCTOP_DATABASE_PASSWORD=${OCTOP_DATABASE_PASSWORD:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      - LANGFUSE_TRACING_ENABLED=${LANGFUSE_TRACING_ENABLED:-true}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_BASE_URL=${LANGFUSE_BASE_URL:-}

  # Nạp dữ liệu mẫu (provider, agency, expert, flow) ngay khi khởi động.
  # Chạy 1 lần rồi thoát; idempotent nên `docker compose up` lại không tạo trùng.
  seed:
    image: python:3.12-slim
    depends_on:
      - octop
    restart: "no"
    working_dir: /app
    volumes:
      - ./scripts:/app/scripts:ro
      - ${OCTOP_DATA:-./data}:/data:ro
    env_file:
      - path: .env.seed
        required: false
    environment:
      - OCTOP_BASE=http://octop:${OCTOP_PORT:-8088}/api
      - OCTOP_CRED_FILE=/data/credential.txt
    command: ["python", "scripts/seed-sample-data.py"]
